services:
  ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dealit-ai
    env_file:
      - .env
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
